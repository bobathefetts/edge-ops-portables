<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYOB — Local AI Coworker + Outlook Classic</title>
  <style>
    :root {
      --bg: #0c1118;
      --sidebar: #0f1621;
      --panel: #141d2b;
      --card: #182232;
      --border: #253449;
      --text: #e6edf6;
      --muted: #8fa2ba;
      --accent: #38bdf8;
      --ok: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
    }
    body.light {
      --bg: #f6f8fb;
      --sidebar: #eef2f7;
      --panel: #ffffff;
      --card: #f8fafc;
      --border: #d5deea;
      --text: #0f172a;
      --muted: #526277;
      --accent: #0284c7;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    .app { display: grid; grid-template-columns: 250px 1fr 370px; height: 100vh; overflow: hidden; }
    .app.no-pane { grid-template-columns: 250px 1fr; }
    .app.no-pane .right-pane { display: none; }

    /* Sidebar */
    .sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .brand { padding: 14px 14px 10px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .brand h1 { margin: 0; font-size: 16px; letter-spacing: 0.03em; }
    .side-sec { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    .side-list { flex: 1; overflow-y: auto; padding: 8px; }
    .chat-row {
      padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; margin-bottom: 4px;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .chat-row:hover { background: var(--panel); }
    .chat-row.active { background: var(--card); border: 1px solid var(--border); }
    .chat-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .side-foot { padding: 10px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }

    /* Main Chat */
    .main { display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .topbar {
      padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
    }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .chip {
      font-size: 12px; padding: 4px 10px; border-radius: 999px; background: var(--card);
      border: 1px solid var(--border); cursor: pointer; color: var(--text);
    }
    .chip.ok { border-color: var(--ok); color: var(--ok); }
    .chip.warn { border-color: var(--warn); color: var(--warn); }
    .chip.active { background: #0c4a6e; border-color: var(--accent); color: #e0f2fe; }

    .messages { flex: 1; overflow-y: auto; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 820px; width: 100%; margin: 0 auto; }
    .msg.user .bubble {
      background: #0e3a5c; border: 1px solid #1e5785; color: #f0f9ff;
      margin-left: auto; max-width: 82%; border-radius: 12px; padding: 10px 14px; white-space: pre-wrap;
    }
    .msg.assistant .bubble {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 16px;
    }
    .msg-meta { font-size: 11px; color: var(--muted); margin-top: 5px; display: flex; gap: 10px; align-items: center; }
    .step-list { margin-bottom: 8px; display: flex; flex-direction: column; gap: 4px; }
    .step-item {
      font-size: 12px; padding: 5px 9px; border-radius: 6px; background: var(--card); border: 1px solid var(--border);
      color: var(--muted);
    }
    .approval-card {
      max-width: 820px; width: 100%; margin: 0 auto; background: #261b12; border: 1px solid var(--warn);
      border-radius: 10px; padding: 12px 14px; font-size: 13px;
    }
    .approval-card.danger { background: #2a1215; border-color: var(--bad); }
    .starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; max-width: 760px; margin: 28px auto; }
    .starter {
      background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; text-align: left;
    }
    .starter:hover { border-color: var(--accent); }
    .starter b { display: block; font-size: 13px; margin-bottom: 4px; color: var(--accent); }
    .starter span { font-size: 12px; color: var(--muted); }

    .composer { border-top: 1px solid var(--border); background: var(--panel); padding: 12px 18px; }
    .composer-inner { max-width: 820px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .composer-row { display: flex; gap: 8px; align-items: flex-end; }
    textarea.input-box {
      flex: 1; min-height: 44px; max-height: 160px; resize: vertical; background: var(--bg); color: var(--text);
      border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: inherit; font-size: 13px;
    }

    /* Right Pane */
    .right-pane { background: var(--sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    .pane-tabs { display: flex; border-bottom: 1px solid var(--border); background: var(--panel); }
    .pane-tab { flex: 1; padding: 10px 6px; text-align: center; font-size: 12px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; }
    .pane-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
    .pane-body { flex: 1; overflow-y: auto; padding: 12px; font-size: 13px; }
    .mail-card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
    .mail-subj { font-weight: 600; font-size: 13px; margin-bottom: 3px; }
    .mail-meta { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .mail-prev { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
    .badge { display: inline-block; font-size: 10px; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); margin-right: 4px; }
    .badge.unread { border-color: var(--accent); color: var(--accent); }
    .badge.replied { border-color: var(--ok); color: var(--ok); }
    .badge.sens { border-color: var(--warn); color: var(--warn); }

    /* Controls */
    button {
      background: var(--card); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 6px 11px; font-size: 12px; cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #06131f; font-weight: 600; }
    button.danger { background: #451a1a; border-color: #7f1d1d; color: #fecaca; }
    button:hover { filter: brightness(1.1); }
    input[type=text], input[type=password], input[type=number], select, textarea.field {
      width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 9px; font-family: inherit; font-size: 12px;
    }
    label { display: block; font-size: 11px; color: var(--muted); margin: 8px 0 3px; }

    /* Markdown basics */
    .md pre { background: #0a0f16; padding: 10px; border-radius: 6px; overflow-x: auto; font-size: 12px; border: 1px solid var(--border); }
    .md code { background: #0a0f16; padding: 1px 4px; border-radius: 4px; font-size: 12px; }
    .md p { margin: 0 0 8px; }
    .md p:last-child { margin-bottom: 0; }
    .md ul { margin: 4px 0 8px 18px; padding: 0; }
    table.csv { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.csv th, table.csv td { border: 1px solid var(--border); padding: 4px 6px; text-align: left; }

    /* Modal */
    .modal-bg {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.65); display: none;
      align-items: center; justify-content: center; z-index: 50;
    }
    .modal-bg.open { display: flex; }
    .modal {
      width: min(620px, 94vw); max-height: 88vh; overflow-y: auto; background: var(--panel);
      border: 1px solid var(--border); border-radius: 12px; padding: 18px;
    }
  </style>
</head>
<body>
  <div class="app" id="appRoot">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <h1>BYOB <span style="font-size:11px;color:var(--muted);font-weight:400;">Edge-Ops</span></h1>
        <button class="primary" onclick="newChat()">+ New</button>
      </div>
      <div class="side-sec">
        <label style="margin-top:0;">Workspace</label>
        <div style="display:flex;gap:6px;">
          <select id="wsSelect" onchange="onWorkspaceChange()"></select>
          <button onclick="addWorkspace()" title="Add workspace folder">+</button>
        </div>
        <label>Search chats (Ctrl+F)</label>
        <input type="text" id="chatSearch" placeholder="Filter chats..." oninput="renderChatList()">
      </div>
      <div class="side-list" id="chatList"></div>
      <div class="side-foot">
        <button style="flex:1;" onclick="openSettings()">Settings (Ctrl+,)</button>
        <button class="danger" onclick="shutdownApp()" title="Stop BYOB host">Quit</button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="main">
      <div class="topbar">
        <div class="chips">
          <strong id="chatTitle" style="font-size:14px;">New chat</strong>
          <span class="chip" id="modelChip" onclick="openSettings()">No model</span>
          <span class="chip" id="outlookChip" onclick="togglePane('outlook')">Outlook: ...</span>
          <span class="chip" id="approvalChip" onclick="cycleApprovals()">Approvals: ask_writes</span>
        </div>
        <div class="chips">
          <span class="chip" id="tabBtnOutlook" onclick="togglePane('outlook')">Outlook</span>
          <span class="chip" id="tabBtnArt" onclick="togglePane('artifacts')">Artifacts</span>
          <span class="chip" id="tabBtnPlan" onclick="togglePane('plan')">Plan</span>
        </div>
      </div>

      <div class="messages" id="messages"></div>

      <div id="approvalHost" style="padding:0 18px 8px;"></div>

      <div class="composer">
        <div class="composer-inner">
          <div id="attachPreview" style="font-size:11px;color:var(--muted);"></div>
          <div class="composer-row">
            <input type="file" id="fileInput" accept="image/*" style="display:none" onchange="onAttach(event)">
            <button onclick="document.getElementById('fileInput').click()" title="Attach image">Attach</button>
            <textarea class="input-box" id="promptBox" placeholder="Ask about your Outlook emails, workspace files, spreadsheets, or tasks... (Enter to send, Shift+Enter for newline)"></textarea>
            <button class="primary" id="sendBtn" onclick="sendMessage()">Send</button>
            <button class="danger" id="stopBtn" style="display:none;" onclick="stopTurn()">Stop</button>
          </div>
        </div>
      </div>
    </main>

    <!-- Right Side Pane -->
    <aside class="right-pane">
      <div class="pane-tabs">
        <div class="pane-tab active" id="paneTab_outlook" onclick="setPaneTab('outlook')">Outlook</div>
        <div class="pane-tab" id="paneTab_artifacts" onclick="setPaneTab('artifacts')">Artifacts</div>
        <div class="pane-tab" id="paneTab_plan" onclick="setPaneTab('plan')">Plan</div>
      </div>
      <div class="pane-body" id="paneBody"></div>
    </aside>
  </div>

  <!-- Settings Modal -->
  <div class="modal-bg" id="settingsModal">
    <div class="modal">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
        <h2 style="margin:0;font-size:16px;">BYOB Settings</h2>
        <button onclick="closeSettings()">Close</button>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
        <button class="primary" onclick="detectLocalModels()">Detect Local Servers</button>
        <button onclick="applyPreset('http://127.0.0.1:8776/v1','openai')">Fairlead (8776)</button>
        <button onclick="applyPreset('http://127.0.0.1:1234/v1','openai')">Phoenix LAI / LM Studio</button>
        <button onclick="applyPreset('http://127.0.0.1:11434/v1','openai')">Ollama (11434)</button>
        <button onclick="applyPreset('https://api.anthropic.com/v1','anthropic')">Anthropic</button>
        <button onclick="applyPreset('https://api.openai.com/v1','openai')">OpenAI</button>
      </div>
      <div id="detectedBox" style="font-size:12px;color:var(--muted);margin-bottom:8px;"></div>

      <label>Inference Base URL</label>
      <input type="text" id="setUrl">
      <label>Model Name</label>
      <input type="text" id="setModel" placeholder="e.g. qwen3.5:4b, llama3.2, claude-sonnet-4-5">
      <label>API Kind</label>
      <select id="setApi">
        <option value="auto">Auto</option>
        <option value="openai">OpenAI (/v1)</option>
        <option value="anthropic">Anthropic (/v1/messages)</option>
      </select>
      <label>API Key (stored in .\data\secrets.json; leave blank to keep current)</label>
      <input type="password" id="setKey" placeholder="sk-...">
      <div style="margin-top:8px;display:flex;gap:8px;align-items:center;">
        <button onclick="testConnection()">Test Connection</button>
        <span id="testMsg" style="font-size:12px;color:var(--muted);"></span>
      </div>

      <hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">
      <label>Approvals Mode</label>
      <select id="setApprovals">
        <option value="ask_writes">Ask on file writes, commands &amp; Outlook changes (recommended)</option>
        <option value="ask_all">Ask on every tool call</option>
        <option value="yolo">YOLO (auto-approve workspace tools; sending email still confirms)</option>
      </select>
      <label>Outlook Default Days Back</label>
      <input type="number" id="setOutlookDays" min="0" max="365" value="14">
      <label style="display:flex;align-items:center;gap:6px;margin-top:10px;">
        <input type="checkbox" id="setAllowSens" style="width:auto;"> Allow AI to read bodies flagged as sensitive/PII
      </label>
      <label>Extra System Instructions</label>
      <textarea class="field" id="setExtra" rows="3" placeholder="Optional instructions for every chat..."></textarea>
      <label>Theme</label>
      <select id="setTheme">
        <option value="dark">Dark (Fleet Night Watch)</option>
        <option value="light">Light</option>
      </select>

      <div style="margin-top:14px;display:flex;justify-content:flex-end;gap:8px;">
        <button class="primary" onclick="saveSettings()">Save Settings</button>
      </div>
    </div>
  </div>

  <script>
    let state = { settings: {}, workspaces: [], chats: [] };
    let activeChatId = null;
    let activePane = 'outlook';
    let paneOpen = true;
    let outlookEmails = [];
    let outlookStatus = { connected: false };
    let attachments = [];
    let activeRun = false;
    let eventCursor = 0;

    async function api(path, method = 'GET', body = null) {
      const opts = { method, cache: 'no-store', headers: {} };
      if (body !== null) {
        opts.headers['Content-Type'] = 'application/json';
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      return await res.json();
    }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderMd(text) {
      let s = esc(text || '');
      s = s.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code}</code></pre>`);
      s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/^### (.+)$/gm, '<h4>$1</h4>');
      s = s.replace(/^## (.+)$/gm, '<h3>$1</h3>');
      s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
      s = s.replace(/(<li>[\s\S]*?<\/li>)/g, '<ul>$1</ul>').replace(/<\/ul>\s*<ul>/g, '');
      s = s.replace(/\n\n/g, '</p><p>').replace(/\n/g, '<br>');
      return `<div class="md"><p>${s}</p></div>`;
    }

    async function loadState() {
      state = await api('/api/state');
      document.body.className = state.settings.theme === 'light' ? 'light' : '';
      if (!activeChatId || !state.chats.find(c => c.id === activeChatId)) {
        activeChatId = state.chats.length ? state.chats[0].id : null;
      }
      renderWorkspaces();
      renderChatList();
      renderTopbar();
      renderChat();
      renderPane();
    }

    function activeChat() {
      return state.chats.find(c => c.id === activeChatId) || null;
    }

    function renderWorkspaces() {
      const sel = document.getElementById('wsSelect');
      const chat = activeChat();
      const curWs = chat ? chat.workspaceId : (state.workspaces[0] && state.workspaces[0].id);
      sel.innerHTML = '';
      for (const w of state.workspaces) {
        const opt = document.createElement('option');
        opt.value = w.id;
        opt.textContent = `${w.name} (${w.path})`;
        sel.appendChild(opt);
      }
      if (curWs) sel.value = curWs;
    }

    function renderChatList() {
      const q = (document.getElementById('chatSearch').value || '').toLowerCase();
      const box = document.getElementById('chatList');
      box.innerHTML = '';
      for (const c of state.chats) {
        if (q && !c.title.toLowerCase().includes(q)) continue;
        const div = document.createElement('div');
        div.className = 'chat-row' + (c.id === activeChatId ? ' active' : '');
        div.onclick = () => { activeChatId = c.id; renderChatList(); renderTopbar(); renderChat(); renderPane(); };
        const span = document.createElement('span');
        span.className = 'chat-title';
        span.textContent = c.title || 'New chat';
        const del = document.createElement('button');
        del.textContent = 'x';
        del.style.padding = '1px 6px';
        del.onclick = async (e) => {
          e.stopPropagation();
          await api('/api/chats', 'POST', { action: 'delete', chatId: c.id });
          await loadState();
        };
        div.appendChild(span);
        div.appendChild(del);
        box.appendChild(div);
      }
    }

    function renderTopbar() {
      const chat = activeChat();
      document.getElementById('chatTitle').textContent = chat ? chat.title : 'BYOB';
      const inf = state.settings.inference || {};
      document.getElementById('modelChip').textContent = inf.model ? `${inf.model}` : 'Connect a model';
      document.getElementById('approvalChip').textContent = 'Approvals: ' + (state.settings.approvals || 'ask_writes');
      const oc = document.getElementById('outlookChip');
      if (outlookStatus.connected) {
        oc.className = 'chip ok';
        oc.textContent = `Outlook: ${outlookStatus.inboxUnread || 0} unread`;
      } else {
        oc.className = 'chip warn';
        oc.textContent = 'Outlook: unavailable';
      }
    }

    function renderChat() {
      const box = document.getElementById('messages');
      const chat = activeChat();
      box.innerHTML = '';
      if (!chat || !chat.messages || !chat.messages.length) {
        box.innerHTML = `
          <div class="starters">
            <div class="starter" onclick="useStarter('Check my recent Outlook Classic inbox emails, group them by priority (needs reply vs FYI vs automated), and ask me which ones I want to draft replies for.')">
              <b>Triage my Outlook inbox</b>
              <span>Scan Inbox + Sent Items and group what needs your reply.</span>
            </div>
            <div class="starter" onclick="useStarter('Search my Outlook Inbox for recent emails where I have not replied yet, summarize each concisely, and offer to draft replies.')">
              <b>Find emails needing a reply</b>
              <span>Cross-check Sent Items so answered threads are skipped.</span>
            </div>
            <div class="starter" onclick="useStarter('List the files in my workspace and summarize what is here.')">
              <b>Explore workspace</b>
              <span>Inspect code, Office docs (.docx/.xlsx/.pptx), and CSVs.</span>
            </div>
          </div>`;
        return;
      }

      for (const m of chat.messages) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');
        if (m.role === 'user') {
          wrap.innerHTML = `<div class="bubble">${esc(m.text)}</div>`;
        } else {
          let stepsHtml = '';
          if (m.steps && m.steps.length) {
            stepsHtml = '<div class="step-list">' + m.steps.map(s => `<div class="step-item"><strong>${esc(s.tool)}</strong> (${esc(s.status)})</div>`).join('') + '</div>';
          }
          let thinkHtml = '';
          if (m.thinking) {
            thinkHtml = `<details style="margin-bottom:8px;font-size:12px;color:var(--muted);"><summary>Thinking</summary><pre style="white-space:pre-wrap;">${esc(m.thinking)}</pre></details>`;
          }
          wrap.innerHTML = `
            <div class="bubble">${thinkHtml}${stepsHtml}${renderMd(m.text)}</div>
            <div class="msg-meta">
              <span>${esc(m.time || '')}</span>
              <button onclick="undoTurn('${esc(m.turnId || '')}')">Undo file edits</button>
            </div>`;
        }
        box.appendChild(wrap);
      }
      box.scrollTop = box.scrollHeight;
    }

    function useStarter(promptText) {
      document.getElementById('promptBox').value = promptText;
      sendMessage();
    }

    async function newChat() {
      const wsId = document.getElementById('wsSelect').value;
      const c = await api('/api/chats', 'POST', { action: 'new', workspaceId: wsId });
      activeChatId = c.id;
      await loadState();
    }

    async function addWorkspace() {
      const p = prompt('Enter full path to workspace folder:');
      if (!p) return;
      const ws = await api('/api/workspaces', 'POST', { path: p });
      await api('/api/chats', 'POST', { action: 'new', workspaceId: ws.id });
      await loadState();
    }

    function onWorkspaceChange() { newChat(); }

    function onAttach(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        attachments.push({ name: file.name, dataUrl: reader.result });
        document.getElementById('attachPreview').textContent = 'Attached: ' + attachments.map(a => a.name).join(', ');
      };
      reader.readAsDataURL(file);
    }

    async function sendMessage() {
      const box = document.getElementById('promptBox');
      const text = box.value.trim();
      if (!text || activeRun || !activeChatId) return;
      box.value = '';
      const sendAtts = attachments.slice();
      attachments = [];
      document.getElementById('attachPreview').textContent = '';

      activeRun = true;
      eventCursor = 0;
      document.getElementById('sendBtn').style.display = 'none';
      document.getElementById('stopBtn').style.display = '';

      const chat = activeChat();
      chat.messages.push({ role: 'user', text });
      renderChat();

      const liveBox = document.createElement('div');
      liveBox.className = 'msg assistant';
      liveBox.id = 'liveAssistant';
      liveBox.innerHTML = '<div class="bubble" style="color:var(--muted);">Working...</div>';
      document.getElementById('messages').appendChild(liveBox);

      try {
        const res = await api('/api/chat/send', 'POST', { chatId: activeChatId, text, attachments: sendAtts });
        if (res.error) throw new Error(res.error);
        pollRun(activeChatId);
      } catch (err) {
        liveBox.innerHTML = `<div class="bubble" style="color:var(--bad);">${esc(err.message)}</div>`;
        endRunUi();
      }
    }

    function endRunUi() {
      activeRun = false;
      document.getElementById('sendBtn').style.display = '';
      document.getElementById('stopBtn').style.display = 'none';
      document.getElementById('approvalHost').innerHTML = '';
    }

    async function pollRun(chatId) {
      if (!activeRun) return;
      try {
        const data = await api(`/api/chat/events?chatId=${encodeURIComponent(chatId)}&since=${eventCursor}`);
        eventCursor = data.next || eventCursor;
        const live = document.getElementById('liveAssistant');
        for (const ev of (data.events || [])) {
          if (ev.type === 'tool_start' && live) {
            live.querySelector('.bubble').innerHTML += `<div class="step-item">Running <strong>${esc(ev.tool)}</strong>...</div>`;
          } else if (ev.type === 'tool_done' && live) {
            live.querySelector('.bubble').innerHTML += `<div class="step-item"><strong>${esc(ev.step.tool)}</strong>: ${esc(ev.step.status)}</div>`;
          } else if (ev.type === 'approval_needed') {
            showApproval(chatId, ev.approval);
          } else if (ev.type === 'artifact' || ev.type === 'plan') {
            await loadState();
          } else if (ev.type === 'error') {
            if (live) live.querySelector('.bubble').innerHTML = `<span style="color:var(--bad);">${esc(ev.text)}</span>`;
            endRunUi();
            return;
          } else if (ev.type === 'done') {
            endRunUi();
            await loadState();
            return;
          }
        }
        if (!data.running) {
          endRunUi();
          await loadState();
          return;
        }
      } catch (e) { }
      setTimeout(() => pollRun(chatId), 250);
    }

    function showApproval(chatId, apr) {
      const host = document.getElementById('approvalHost');
      host.innerHTML = `
        <div class="approval-card ${apr.mustConfirm ? 'danger' : ''}">
          <div><strong>Approval required:</strong> <code>${esc(apr.tool)}</code> &mdash; ${esc(apr.warning)}</div>
          <pre style="font-size:11px;max-height:110px;overflow:auto;margin:6px 0;">${esc(JSON.stringify(apr.args, null, 2))}</pre>
          <div style="display:flex;gap:8px;">
            <button class="primary" onclick="respondApproval('${chatId}', true)">Approve</button>
            <button class="danger" onclick="respondApproval('${chatId}', false)">Deny</button>
          </div>
        </div>`;
    }

    async function respondApproval(chatId, approved) {
      document.getElementById('approvalHost').innerHTML = '';
      await api('/api/chat/approve', 'POST', { chatId, approved });
    }

    async function stopTurn() {
      if (activeChatId) await api('/api/chat/stop', 'POST', { chatId: activeChatId });
    }

    async function undoTurn(turnId) {
      if (!turnId || !activeChatId) return;
      const r = await api('/api/chats', 'POST', { action: 'undo', chatId: activeChatId, turnId });
      alert(`Restored ${r.restored || 0} file(s) from turn backup.`);
    }

    // Side Pane
    function togglePane(tab) {
      if (paneOpen && activePane === tab) {
        paneOpen = false;
      } else {
        paneOpen = true;
        activePane = tab;
      }
      document.getElementById('appRoot').className = paneOpen ? 'app' : 'app no-pane';
      setPaneTab(activePane);
    }

    function setPaneTab(tab) {
      activePane = tab;
      for (const t of ['outlook', 'artifacts', 'plan']) {
        document.getElementById('paneTab_' + t).className = 'pane-tab' + (t === tab ? ' active' : '');
      }
      renderPane();
    }

    async function refreshOutlook() {
      outlookStatus = await api('/api/outlook/status');
      renderTopbar();
      if (outlookStatus.connected) {
        const folder = (document.getElementById('olFolder') && document.getElementById('olFolder').value) || 'Inbox';
        const q = (document.getElementById('olSearch') && document.getElementById('olSearch').value) || '';
        const res = await api(`/api/outlook/inbox?folder=${encodeURIComponent(folder)}&q=${encodeURIComponent(q)}`);
        outlookEmails = res.emails || [];
      } else {
        outlookEmails = [];
      }
      if (activePane === 'outlook') renderPane();
    }

    function renderPane() {
      const body = document.getElementById('paneBody');
      if (activePane === 'outlook') {
        let html = `
          <div style="display:flex;gap:6px;margin-bottom:8px;">
            <select id="olFolder" onchange="refreshOutlook()" style="width:115px;">
              <option value="Inbox">Inbox</option>
              <option value="Sent Items">Sent Items</option>
              <option value="Drafts">Drafts</option>
              <option value="Archive">Archive</option>
            </select>
            <input type="text" id="olSearch" placeholder="Filter emails..." onkeydown="if(event.key==='Enter')refreshOutlook()">
            <button class="primary" onclick="refreshOutlook()">Sync</button>
          </div>`;
        if (!outlookStatus.connected) {
          html += `<div class="mail-card"><div class="mail-subj">Classic Outlook not connected</div><div class="mail-prev">${esc(outlookStatus.message || 'Open Classic Outlook with a configured MAPI profile on Windows.')}</div></div>`;
        } else if (!outlookEmails.length) {
          html += `<div class="mail-card"><div class="mail-prev">No emails found for this filter.</div></div>`;
        } else {
          for (let i = 0; i < outlookEmails.length; i++) {
            const em = outlookEmails[i];
            html += `
              <div class="mail-card">
                <div class="mail-subj">${esc(em.subject || '(no subject)')}</div>
                <div class="mail-meta">
                  ${em.unread ? '<span class="badge unread">unread</span>' : ''}
                  ${em.appearsReplied ? '<span class="badge replied">replied</span>' : ''}
                  ${em.isSensitive ? '<span class="badge sens">sensitive</span>' : ''}
                  ${esc(em.fromName || em.fromEmail)} &middot; ${esc(em.received)}
                </div>
                <div class="mail-prev">${esc(em.preview || '')}</div>
                <div style="display:flex;gap:6px;">
                  <button class="primary" onclick="askAboutEmail(${i})">Ask AI</button>
                  <button onclick="openEmailOutlook(${i})">Open in Outlook</button>
                </div>
              </div>`;
          }
        }
        body.innerHTML = html;
      } else if (activePane === 'artifacts') {
        const chat = activeChat();
        const arts = (chat && chat.artifacts) || [];
        if (!arts.length) { body.innerHTML = '<div style="color:var(--muted);">No artifacts in this chat yet.</div>'; return; }
        body.innerHTML = arts.slice().reverse().map(a => {
          let viewHtml = '';
          if (a.content_type === 'text/html') {
            viewHtml = `<iframe sandbox="allow-scripts" style="width:100%;height:260px;border:1px solid var(--border);border-radius:6px;background:#fff;" src="/api/artifact/raw?chatId=${encodeURIComponent(chat.id)}&id=${encodeURIComponent(a.id)}&version=${a.version}"></iframe>`;
          } else if (a.content_type === 'text/csv') {
            const rows = a.content.trim().split(/\r?\n/).slice(0, 30).map(r => '<tr>' + r.split(',').map(c => `<td>${esc(c)}</td>`).join('') + '</tr>').join('');
            viewHtml = `<div style="overflow:auto;max-height:240px;"><table class="csv">${rows}</table></div>`;
          } else {
            viewHtml = renderMd(a.content);
          }
          return `<div class="mail-card"><div class="mail-subj">${esc(a.title)} <span class="badge">v${a.version}</span></div><div class="mail-meta">${esc(a.content_type)}</div>${viewHtml}</div>`;
        }).join('');
      } else if (activePane === 'plan') {
        const chat = activeChat();
        const steps = (chat && chat.plan) || [];
        if (!steps.length) { body.innerHTML = '<div style="color:var(--muted);">No active step plan in this chat.</div>'; return; }
        body.innerHTML = steps.map(s => `<div class="mail-card"><span class="badge">${esc(s.status)}</span> ${esc(s.title)}</div>`).join('');
      }
    }

    function askAboutEmail(idx) {
      const em = outlookEmails[idx];
      if (!em) return;
      document.getElementById('promptBox').value = `Read Outlook email EntryID "${em.entryId}" ("${em.subject}" from ${em.fromName}) and help me summarize it and draft a reply.`;
      document.getElementById('promptBox').focus();
    }

    async function openEmailOutlook(idx) {
      const em = outlookEmails[idx];
      if (!em) return;
      await api('/api/outlook/open', 'POST', { entryId: em.entryId });
    }

    // Settings
    function openSettings() {
      const inf = state.settings.inference || {};
      document.getElementById('setUrl').value = inf.base_url || '';
      document.getElementById('setModel').value = inf.model || '';
      document.getElementById('setApi').value = inf.api || 'auto';
      document.getElementById('setKey').value = '';
      document.getElementById('setApprovals').value = state.settings.approvals || 'ask_writes';
      document.getElementById('setOutlookDays').value = state.settings.outlook_days_back != null ? state.settings.outlook_days_back : 14;
      document.getElementById('setAllowSens').checked = !!state.settings.outlook_allow_sensitive;
      document.getElementById('setExtra').value = state.settings.extra_instructions || '';
      document.getElementById('setTheme').value = state.settings.theme || 'dark';
      document.getElementById('settingsModal').classList.add('open');
    }
    function closeSettings() { document.getElementById('settingsModal').classList.remove('open'); }
    function applyPreset(url, apiKind) {
      document.getElementById('setUrl').value = url;
      document.getElementById('setApi').value = apiKind;
    }

    async function detectLocalModels() {
      const box = document.getElementById('detectedBox');
      box.textContent = 'Scanning local ports (8776, 1234, 8777, 8080, 11434, 8000)...';
      const r = await api('/api/detect-models', 'POST', {});
      const eps = r.endpoints || [];
      if (!eps.length) { box.textContent = 'No local model servers answered.'; return; }
      box.innerHTML = eps.map(e => {
        const firstM = (e.models && e.models[0]) || '';
        return `<div style="margin-bottom:4px;">Found <strong>${esc(e.name)}</strong> at <code>${esc(e.url)}</code> (${esc((e.models||[]).join(', ') || 'no models listed')}) <button onclick="useDetected('${esc(e.url)}','${esc(firstM)}','${esc(e.api)}')">Use</button></div>`;
      }).join('');
    }
    function useDetected(u, m, a) {
      document.getElementById('setUrl').value = u;
      if (m) document.getElementById('setModel').value = m;
      document.getElementById('setApi').value = a;
    }

    async function testConnection() {
      const msg = document.getElementById('testMsg');
      msg.textContent = 'Testing...';
      const r = await api('/api/test-connection', 'POST', {
        base_url: document.getElementById('setUrl').value.trim(),
        model: document.getElementById('setModel').value.trim(),
        api: document.getElementById('setApi').value,
        api_key: document.getElementById('setKey').value
      });
      msg.textContent = r.ok ? ('OK: ' + (r.reply || 'connected')) : ('Failed: ' + (r.error || 'error'));
    }

    async function saveSettings() {
      const next = Object.assign({}, state.settings, {
        inference: {
          base_url: document.getElementById('setUrl').value.trim(),
          model: document.getElementById('setModel').value.trim(),
          api: document.getElementById('setApi').value
        },
        approvals: document.getElementById('setApprovals').value,
        outlook_days_back: parseInt(document.getElementById('setOutlookDays').value || '14', 10),
        outlook_allow_sensitive: document.getElementById('setAllowSens').checked,
        extra_instructions: document.getElementById('setExtra').value,
        theme: document.getElementById('setTheme').value
      });
      const body = { settings: next };
      const key = document.getElementById('setKey').value;
      if (key) body.api_key = key;
      await api('/api/settings', 'POST', body);
      closeSettings();
      await loadState();
    }

    async function cycleApprovals() {
      const order = ['ask_writes', 'ask_all', 'yolo'];
      const cur = state.settings.approvals || 'ask_writes';
      const nxt = order[(order.indexOf(cur) + 1) % order.length];
      state.settings.approvals = nxt;
      await api('/api/settings', 'POST', { settings: state.settings });
      renderTopbar();
    }

    async function shutdownApp() {
      if (!confirm('Stop BYOB?')) return;
      await fetch('/__fleethacker/shutdown', { method: 'POST', headers: { 'X-FleetHacker-Shutdown': '1' } });
      window.close();
    }

    document.getElementById('promptBox').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === ',') { e.preventDefault(); openSettings(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'f') { e.preventDefault(); document.getElementById('chatSearch').focus(); }
    });

    loadState().then(() => refreshOutlook());
  </script>
</body>
</html>
